<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DS/ML Interview</title>
  <style>
    body { font-family: monospace; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 0.4rem; font-size: 1rem; }
    button { margin-top: 1rem; padding: 0.5rem 1.5rem; font-size: 1rem; cursor: pointer; }
    .note { color: #555; font-size: 0.9rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>DS / ML Engineer Interview</h1>
  <p>You will be given a data science or ML problem.
     Explain your reasoning clearly — that matters more than perfect code.</p>
  <form method="post" action="/sessions">
    <label for="handle">Your name or handle</label>
    <input id="handle" name="candidate_handle" type="text" required autofocus placeholder="e.g. alice">
    <p class="note">This is used only to label your session. No account required.</p>
    <button type="submit">Start interview</button>
  </form>
</body>
</html>
