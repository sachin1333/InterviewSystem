<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Interview — session {{ session_id }}</title>
  <link rel="stylesheet" href="/static/voice.css">
  <style>
    :root {
      --bg: #f7f7f8;
      --bubble-them: #ffffff;
      --bubble-you: #2f6df5;
      --bubble-you-text: #ffffff;
      --border: #e3e3e6;
      --text: #1a1a1a;
      --muted: #6b6b70;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
                 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .app { display: flex; flex-direction: column; height: 100vh; max-width: 760px; margin: 0 auto;
           background: var(--bg); }
    .header { padding: 0.9rem 1.2rem; border-bottom: 1px solid var(--border); background: #fff;
              display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
    .header .meta { font-size: 0.8rem; color: var(--muted); }
    .chat { flex: 1; overflow-y: auto; padding: 1.2rem; display: flex; flex-direction: column;
            gap: 0.8rem; }
    .msg { display: flex; max-width: 85%; }
    .msg.interviewer { align-self: flex-start; }
    .msg.candidate { align-self: flex-end; }
    .bubble { padding: 0.7rem 0.95rem; border-radius: 1.1rem; line-height: 1.45;
              white-space: pre-wrap; word-wrap: break-word; font-size: 0.95rem; }
    .msg.interviewer .bubble { background: var(--bubble-them); color: var(--text);
                               border: 1px solid var(--border); border-bottom-left-radius: 0.3rem; }
    .msg.candidate .bubble { background: var(--bubble-you); color: var(--bubble-you-text);
                             border-bottom-right-radius: 0.3rem; }
    .role { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.2rem;
            text-transform: uppercase; letter-spacing: 0.04em; }
    .composer { border-top: 1px solid var(--border); background: #fff; padding: 0.8rem 1rem;
                display: flex; flex-direction: column; gap: 0.5rem; }
    .composer textarea { width: 100%; resize: none; border: 1px solid var(--border);
                         border-radius: 0.7rem; padding: 0.6rem 0.8rem; font-size: 0.95rem;
                         font-family: inherit; min-height: 56px; max-height: 220px; outline: none; }
    .composer textarea:focus { border-color: var(--bubble-you); }
    .composer .row { display: flex; gap: 0.6rem; align-items: flex-end; }
    .composer .row textarea { flex: 1; }
    .composer button { background: var(--bubble-you); color: #fff; border: 0;
                       border-radius: 0.7rem; padding: 0.6rem 1.1rem; font-size: 0.95rem;
                       cursor: pointer; font-weight: 500; }
    .composer button:hover { filter: brightness(1.05); }
    .code-toggle { font-size: 0.8rem; color: var(--muted); background: none; border: 0;
                   cursor: pointer; padding: 0; align-self: flex-start; text-decoration: underline;
                   margin-top: -0.2rem; }
    .code-area { display: none; }
    .code-area.open { display: block; }
    .code-area textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                          font-size: 0.85rem; min-height: 120px; }
    .empty { color: var(--muted); font-size: 0.9rem; text-align: center; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="app" data-voice-enabled="{{ 'true' if voice_mode else 'false' }}">
    <div class="header">
      <h1>Interview</h1>
      <span class="meta">{{ turn_kind }} · {{ session_id }}</span>
    </div>

    <div class="chat" id="chat">
      {% if not messages %}
        <div class="empty">Waiting for the interviewer…</div>
      {% endif %}
      {% for m in messages %}
        <div class="msg {{ m.role }}">
          <div>
            <div class="role">{{ "Interviewer" if m.role == "interviewer" else "You" }}</div>
            <div class="bubble">{{ m.text }}</div>
          </div>
        </div>
      {% endfor %}
      {% if probe_pending %}
      <div class="msg interviewer" id="probe-streaming">
        <div>
          <div class="role">Interviewer</div>
          <div class="bubble" id="probe-stream-text">…</div>
        </div>
      </div>
      <script>
      (() => {
        const target = document.getElementById('probe-stream-text');
        const es = new EventSource("/sessions/{{ session_id }}/probe-stream");
        let buf = "";
        es.onmessage = (e) => {
          if (e.data === "[DONE]") { es.close(); return; }
          buf += e.data;
          target.textContent = buf;
          document.getElementById('chat').scrollTop = 1e9;
        };
        es.addEventListener('done', () => es.close());
      })();
      </script>
      {% endif %}
    </div>

    <details data-mode="text" {% if not voice_mode %}open{% endif %}>
      <form class="composer" method="post" action="/sessions/{{ session_id }}/turn" id="composer">
        <input type="hidden" name="turn_nonce" value="{{ turn_nonce }}">
        <div class="row">
          <textarea id="answer" name="answer" rows="2" autofocus
            placeholder="{% if turn_kind == 'defense' %}Respond to the follow-up…{% else %}Type your answer…{% endif %}"></textarea>
          <button type="submit">Send</button>
        </div>
        <button type="button" class="code-toggle" onclick="document.getElementById('code-wrap').classList.toggle('open')">
          + add code
        </button>
        <div class="code-area" id="code-wrap">
          <textarea id="code" name="code" rows="6"
            placeholder="# Optional Python code (will be executed)"></textarea>
        </div>
      </form>
    </details>

    <div
      id="voice-bar"
      class="voice-bar"
      data-voice-mode="{{ 'on' if voice_mode else 'off' }}"
      data-voice-policy="{{ voice_mode_setting }}"
      data-allow-text-switch="{{ 'true' if allow_text_switch else 'false' }}"
    >
      <div id="voice-status" class="voice-status status-idle">Idle</div>
      <div id="voice-transcript" class="voice-transcript"></div>
      <button
        type="button"
        id="voice-switch-btn"
        class="voice-switch-btn"
        {% if not allow_text_switch %}hidden{% endif %}
      >Switch to typing</button>
    </div>
  </div>

  <script>
    // Auto-scroll chat to bottom on load.
    const chat = document.getElementById('chat');
    chat.scrollTop = chat.scrollHeight;

    // Submit on Enter, newline on Shift+Enter.
    const answer = document.getElementById('answer');
    const composer = document.getElementById('composer');
    answer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (answer.value.trim()) composer.submit();
      }
    });

    // Auto-grow textarea.
    answer.addEventListener('input', () => {
      answer.style.height = 'auto';
      answer.style.height = Math.min(answer.scrollHeight, 220) + 'px';
    });
  </script>

  <script>window.SESSION_ID = "{{ session_id }}";</script>
  <script src="/static/voice.js" defer></script>
</body>
</html>
