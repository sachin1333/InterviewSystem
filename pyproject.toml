[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interview-system"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "fastapi>=0.111",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.2.2",
  "uvicorn>=0.46.0",
]


[tool.hatch.build.targets.wheel]
packages = ["core", "adapters", "tools"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "httpx>=0.27",
  "anyio>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
